version: '3.4'

services:
  catalogdb:
    container_name: catalogdb
    image: postgres:17.2 
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    volumes:
      - postgres_catalog:/var/lib/postgresql/data

volumes:
  postgres_catalog: 